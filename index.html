<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>TO MY LOVE</title>
<style>
:root{
  --bg:#000;
  --white:#f7fbff;
  --blue:#46b8ff;
  --blue2:#176bff;
  --blue3:#8bd8ff;
  --muted:#8b96a6;
  --violet:#746bff;
  --violet2:#9b8cff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:var(--white);overflow:hidden}
body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}

.app{position:relative;width:100%;height:100svh;background:#000;display:grid;place-items:center;isolation:isolate}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(34,146,255,.10),transparent 31%);opacity:.55;z-index:-2}
.blue-edge{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px rgba(22,107,255,.07);z-index:30}

.screen{position:absolute;inset:0;display:grid;place-items:center;padding:28px;opacity:0;visibility:hidden;transform:scale(.985);transition:opacity .38s ease,transform .38s ease,visibility .38s}
.screen.active{opacity:1;visibility:visible;transform:scale(1)}

.card{width:min(620px,100%);text-align:center}
.brand{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:#687385;margin-bottom:40px}
.question{margin:0 0 28px;font-size:clamp(38px,7vw,72px);line-height:.98;letter-spacing:-.045em;font-weight:800;color:#fff}
.question .blue{color:var(--blue);text-shadow:0 0 24px rgba(70,184,255,.22)}
.sub{color:#657082;font-size:14px;margin:-12px 0 25px}

.name-row{display:flex;gap:10px;max-width:470px;margin:0 auto}
.name-input{flex:1;min-width:0;height:56px;border:1px solid #1d2631;border-radius:16px;background:#080a0d;color:white;outline:none;padding:0 18px;font-size:17px;box-shadow:0 0 0 0 rgba(70,184,255,0);transition:border-color .22s,box-shadow .22s,background .22s}
.name-input:focus{border-color:#318cd0;background:#090d12;box-shadow:0 0 0 4px rgba(70,184,255,.08),0 0 34px rgba(70,184,255,.06)}
.name-input::placeholder{color:#414b58}
.go{height:56px;padding:0 20px;border:0;border-radius:16px;background:#fff;color:#000;font-weight:800;cursor:pointer;transition:transform .16s,background .16s,box-shadow .16s}
.go:hover{background:#dff4ff;box-shadow:0 0 30px rgba(70,184,255,.16)}
.go:active{transform:scale(.96)}

.creature{width:92px;height:78px;margin:0 auto 28px;position:relative;filter:drop-shadow(0 0 18px rgba(70,184,255,.13));transition:transform .25s ease,filter .25s ease}
.creature .head{position:absolute;inset:0 7px 4px;border-radius:45% 45% 42% 42% / 46% 46% 54% 54%;border:1px solid #21455e;background:linear-gradient(180deg,#0b1b26,#06090d)}
.creature .head:before,.creature .head:after{content:"";position:absolute;top:30px;width:9px;height:13px;border-radius:50%;background:#dff7ff;box-shadow:0 0 14px rgba(70,184,255,.65)}
.creature .head:before{left:22px}.creature .head:after{right:22px}
.creature .mouth{position:absolute;width:18px;height:7px;border-bottom:2px solid #4dbbff;border-radius:50%;left:50%;top:49px;transform:translateX(-50%)}
.creature .ear{position:absolute;top:2px;width:27px;height:34px;border:1px solid #21455e;background:#08131b;z-index:-1}
.creature .ear.left{left:8px;transform:rotate(-27deg);border-radius:8px 20px 8px 20px}.creature .ear.right{right:8px;transform:rotate(27deg);border-radius:20px 8px 20px 8px}
.creature.angry{animation:angryShake .34s linear 2;filter:drop-shadow(0 0 28px rgba(0,135,255,.35))}
.creature.angry .head:before{transform:rotate(22deg);border-radius:10px 2px 10px 2px;height:5px;top:31px}
.creature.angry .head:after{transform:rotate(-22deg);border-radius:2px 10px 2px 10px;height:5px;top:31px}
.creature.angry .mouth{width:24px;height:10px;border-top:2px solid #4dbbff;border-bottom:0;border-radius:50%;top:52px}
.creature.bro .head:before,.creature.bro .head:after{height:4px;border-radius:3px;top:34px}
.creature.bro{transform:rotate(-5deg)}

.choice-wrap{display:flex;justify-content:center;gap:12px;margin-top:24px;flex-wrap:wrap}
.choice{min-width:150px;height:54px;border:1px solid #202935;border-radius:15px;background:#090b0f;color:#fff;font-weight:750;cursor:pointer;transition:.18s ease}
.choice:hover{border-color:#397da9;background:#0b1118;box-shadow:0 0 28px rgba(70,184,255,.08)}
.choice:active{transform:scale(.96)}

.verdict{margin:0;max-width:900px;font-size:clamp(38px,8vw,94px);line-height:.93;letter-spacing:-.055em;font-weight:950;text-align:center;text-transform:uppercase;color:#fff}
.verdict.blue{color:#fff;text-shadow:0 0 12px rgba(139,216,255,.4),0 0 40px rgba(70,184,255,.32),0 0 90px rgba(23,107,255,.22)}
.back{margin-top:30px;border:0;background:transparent;color:#505b68;cursor:pointer;font-weight:700}

/* edit */
#edit{background:#000;overflow:hidden}
.edit-stage{position:absolute;inset:0;display:grid;place-items:center;padding:6vw;text-align:center;isolation:isolate}
.edit-stage::before{content:"";position:absolute;inset:-8%;pointer-events:none;z-index:-3;background:
  radial-gradient(ellipse at 50% 49%,rgba(62,164,255,.12) 0%,rgba(16,87,255,.055) 24%,transparent 58%),
  radial-gradient(ellipse at 50% 58%,rgba(30,90,255,.05),transparent 52%);
  opacity:.82;animation:cinemaBreath 5.5s ease-in-out infinite}
.edit-stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:20;box-shadow:inset 0 0 150px rgba(0,0,0,.92),inset 0 0 55px rgba(0,0,0,.72)}
.cinema-bloom{position:absolute;left:50%;top:50%;width:min(78vw,1100px);height:min(24vw,280px);transform:translate(-50%,-50%);pointer-events:none;z-index:0;opacity:.48;background:radial-gradient(ellipse,rgba(100,196,255,.16) 0%,rgba(32,116,255,.075) 32%,transparent 70%);filter:blur(26px);animation:bloomDrift 7s ease-in-out infinite}
.cinema-flare{position:absolute;left:50%;top:50%;width:min(78vw,1050px);height:2px;transform:translate(-50%,-50%);pointer-events:none;z-index:1;opacity:.18;background:linear-gradient(90deg,transparent 0%,rgba(70,184,255,.08) 18%,rgba(183,232,255,.75) 50%,rgba(70,184,255,.08) 82%,transparent 100%);box-shadow:0 0 18px rgba(70,184,255,.32),0 0 46px rgba(23,107,255,.18)}
.edit-kicker{position:absolute;top:max(28px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.48em;text-transform:uppercase;color:#4f5968;white-space:nowrap}
.word{position:relative;z-index:3;max-width:94vw;margin:0;font-size:clamp(58px,13vw,180px);line-height:.83;letter-spacing:-.065em;font-weight:950;text-transform:uppercase;color:#fff;opacity:0;transform:translate3d(0,0,0);text-shadow:0 0 8px rgba(255,255,255,.20),0 0 26px rgba(139,216,255,.10);will-change:transform,opacity;backface-visibility:hidden;perspective:1000px}
.word::before,.word::after{content:attr(data-word);position:absolute;inset:0;pointer-events:none;z-index:-1;opacity:0;color:#52bdff;will-change:transform,opacity}
.word::before{text-shadow:0 0 20px rgba(70,184,255,.35),0 0 46px rgba(23,107,255,.22)}
.word::after{color:#bceaff;text-shadow:0 0 12px rgba(139,216,255,.28)}
.word.motion-down{animation:glideDown var(--wordDur,.72s) cubic-bezier(.18,.72,.24,1) forwards;text-shadow:0 0 8px rgba(255,255,255,.34),0 0 24px rgba(183,232,255,.22),0 0 52px rgba(70,184,255,.18),0 0 100px rgba(23,107,255,.10)}
.word.motion-down::before{animation:trailDown var(--wordDur,.72s) cubic-bezier(.18,.72,.24,1) forwards}
.word.motion-down::after{animation:trailDown2 var(--wordDur,.72s) cubic-bezier(.18,.72,.24,1) forwards}
.word.blue-word{color:#fbfdff;text-shadow:0 0 8px rgba(255,255,255,.52),0 0 21px rgba(183,232,255,.58),0 0 52px rgba(70,184,255,.46),0 0 115px rgba(23,107,255,.28)}
.word.hide{animation:wordOut .32s ease forwards}

.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at center,rgba(166,229,255,.28),rgba(38,137,255,.12) 24%,transparent 58%)}
.flash.hit{animation:flash .38s ease-out}
.line-streak{position:absolute;left:50%;top:50%;width:0;height:1px;background:linear-gradient(90deg,transparent,#7bd4ff,transparent);box-shadow:0 0 18px rgba(70,184,255,.75);transform:translate(-50%,-50%) rotate(-8deg);opacity:0;pointer-events:none}
.line-streak.hit{animation:streak .52s ease-out}
.end-love{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.34em;color:#2f3947;text-transform:uppercase;opacity:0;transition:opacity 1s ease;white-space:nowrap}
.end-love.visible{opacity:1;color:#6b8196;text-shadow:0 0 15px rgba(70,184,255,.15)}


/* fast star moment — intentionally lightweight: transforms + opacity only */
.star-field{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .16s ease}
.star-field.active{opacity:1}
.star-field .star{position:absolute;left:var(--x);top:var(--y);width:var(--s);aspect-ratio:1;opacity:0;transform:translate3d(0,12px,0) scale(.3) rotate(0deg);will-change:transform,opacity;filter:drop-shadow(0 0 7px rgba(117,104,255,.55));background:linear-gradient(135deg,#b9b0ff 0%,#776cff 46%,#596bff 100%);clip-path:polygon(50% 0%,61% 37%,100% 50%,61% 63%,50% 100%,39% 63%,0 50%,39% 37%)}
.star-field.active .star{animation:starFloat var(--dur) cubic-bezier(.18,.72,.24,1) var(--delay) both}
.star-field .star:nth-child(3n){background:linear-gradient(135deg,#d9d4ff,#8378ff 55%,#5976ff)}
.star-field .star:nth-child(4n){filter:drop-shadow(0 0 10px rgba(92,114,255,.68))}

.fall-guy{position:absolute;left:clamp(67%,72vw,78%);top:50%;width:clamp(48px,6vw,84px);height:auto;z-index:4;color:#fff;opacity:0;pointer-events:none;will-change:transform,opacity;filter:drop-shadow(0 0 9px rgba(255,255,255,.28)) drop-shadow(0 0 24px rgba(70,184,255,.18));transform:translate3d(-50%,-92vh,0) rotate(-7deg) scale(.94)}
.fall-guy.falling{animation:fallGuy 1.02s cubic-bezier(.16,.66,.2,1) forwards}

@keyframes starFloat{
  0%{opacity:0;transform:translate3d(0,16px,0) scale(.2) rotate(-16deg)}
  16%{opacity:.92;transform:translate3d(0,0,0) scale(1.08) rotate(4deg)}
  48%{opacity:.72;transform:translate3d(var(--dx),var(--dy),0) scale(.88) rotate(18deg)}
  100%{opacity:0;transform:translate3d(var(--dx2),var(--dy2),0) scale(.42) rotate(42deg)}
}
@keyframes fallGuy{
  0%{opacity:0;transform:translate3d(-50%,-90vh,0) rotate(-8deg) scale(.92)}
  8%{opacity:1}
  68%{opacity:1;transform:translate3d(-50%,3vh,0) rotate(4deg) scale(1)}
  100%{opacity:0;transform:translate3d(-50%,62vh,0) rotate(10deg) scale(.96)}
}

#yt{position:fixed;width:1px;height:1px;left:-10000px;top:-10000px;opacity:0;pointer-events:none}

@keyframes glideDown{
  0%{opacity:0;transform:translate3d(0,-22vh,0) scale(.965);filter:blur(4px);letter-spacing:-.03em}
  18%{opacity:.68;transform:translate3d(0,-7vh,0) scale(.982);filter:blur(1.8px);letter-spacing:-.05em}
  34%{opacity:1;transform:translate3d(0,-1.2vh,0) scale(1.004);filter:blur(0);letter-spacing:-.065em}
  58%{opacity:1;transform:translate3d(0,0,0) scale(1.008);filter:blur(0)}
  82%{opacity:.98;transform:translate3d(0,2.4vh,0) scale(1.01);filter:blur(.15px)}
  100%{opacity:0;transform:translate3d(0,8.5vh,0) scale(1.018);filter:blur(2.2px)}
}
@keyframes trailDown{
  0%{opacity:0;transform:translate3d(0,-17vh,0) scale(.97);filter:blur(5px)}
  18%{opacity:.20;transform:translate3d(0,-10vh,0) scale(.982);filter:blur(3.2px)}
  38%{opacity:.14;transform:translate3d(0,-5.2vh,0) scale(.992);filter:blur(2.4px)}
  65%{opacity:.08;transform:translate3d(0,-2.4vh,0) scale(1);filter:blur(1.8px)}
  100%{opacity:0;transform:translate3d(0,3.8vh,0) scale(1.01);filter:blur(3.8px)}
}
@keyframes trailDown2{
  0%{opacity:0;transform:translate3d(0,-25vh,0) scale(.955);filter:blur(7px)}
  22%{opacity:.11;transform:translate3d(0,-14vh,0) scale(.975);filter:blur(5.5px)}
  45%{opacity:.075;transform:translate3d(0,-8vh,0) scale(.988);filter:blur(4px)}
  72%{opacity:.04;transform:translate3d(0,-4vh,0) scale(.998);filter:blur(3px)}
  100%{opacity:0;transform:translate3d(0,1.5vh,0) scale(1.008);filter:blur(5px)}
}
@keyframes wordOut{to{opacity:0;transform:translate3d(0,-18px,0) scale(1.04)}}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
@keyframes streak{0%{opacity:0;width:0}34%{opacity:.9;width:min(72vw,850px)}100%{opacity:0;width:min(90vw,1100px)}}
@keyframes cinemaBreath{50%{opacity:1;transform:scale(1.025)}}
@keyframes bloomDrift{0%,100%{transform:translate(-50%,-50%) scale(.96);opacity:.38}50%{transform:translate(-50%,-50%) scale(1.07);opacity:.62}}
@keyframes angryShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px) rotate(-3deg)}75%{transform:translateX(8px) rotate(3deg)}}

@media(max-width:640px){
 .name-row{flex-direction:column}.go{width:100%}.question{font-size:clamp(42px,13vw,66px)}
 .word{font-size:clamp(54px,18vw,112px);line-height:.86}
 .choice{min-width:135px;flex:1}
 .fall-guy{left:78%;width:56px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app">
  <div class="blue-edge"></div>

  <section class="screen active" id="gate" aria-label="Identity gate">
    <div class="card">
      <div class="creature" aria-hidden="true">
        <i class="ear left"></i><i class="ear right"></i><div class="head"><i class="mouth"></i></div>
      </div>
      <div class="brand">TO MY LOVE</div>
      <h1 class="question">Who are <span class="blue">you?</span></h1>
      <div class="name-row">
        <input id="nameInput" class="name-input" type="text" inputmode="text" autocomplete="off" autocapitalize="words" placeholder="Type your name" aria-label="Type your name" />
        <button id="continueBtn" class="go" type="button">Continue</button>
      </div>
    </div>
  </section>

  <section class="screen" id="gender" aria-label="Choose gender">
    <div class="card">
      <div class="creature" aria-hidden="true">
        <i class="ear left"></i><i class="ear right"></i><div class="head"><i class="mouth"></i></div>
      </div>
      <div class="brand">WRONG PERSON</div>

        <button class="choice" data-gender="male">Male</button>
        <button class="choice" data-gender="female">Female</button>
      </div>
      <button class="back" data-back>← try another name</button>
    </div>
  </section>

  <section class="screen" id="reject" aria-label="Not for you">
    <div class="card">
      <div class="creature angry" id="rejectCreature" aria-hidden="true">
        <i class="ear left"></i><i class="ear right"></i><div class="head"><i class="mouth"></i></div>
      </div>
      <p class="verdict blue" id="rejectText"></p>
      <button class="back" data-back>← leave</button>
    </div>
  </section>

  <section class="screen" id="edit" aria-label="For Anny">
    <div class="edit-stage">
      <div class="edit-kicker">TO MY LOVE</div>
      <div class="cinema-bloom" aria-hidden="true"></div>
      <div class="cinema-flare" aria-hidden="true"></div>
      <div class="flash" id="flash"></div>
      <div class="line-streak" id="streak"></div>
      <div class="star-field" id="starField" aria-hidden="true"></div>

      <p class="word" id="word"></p>
      <div class="end-love" id="endLove">ONLY YOU, ANNY</div>
    </div>
    <div id="yt"></div>
  </section>
</main>

<script>
(() => {
  const START = 108.92;
  const END = 121.85;
  const VIDEO_ID = 'x47TgeRJtH0';

  const screens = [...document.querySelectorAll('.screen')];
  const gate = document.getElementById('gate');
  const gender = document.getElementById('gender');
  const reject = document.getElementById('reject');
  const edit = document.getElementById('edit');
  const input = document.getElementById('nameInput');
  const button = document.getElementById('continueBtn');
  const wordEl = document.getElementById('word');
  const flash = document.getElementById('flash');
  const streak = document.getElementById('streak');
  const starField = document.getElementById('starField');
  const fallGuy = document.getElementById('fallGuy');
  const endLove = document.getElementById('endLove');
  const rejectText = document.getElementById('rejectText');
  const rejectCreature = document.getElementById('rejectCreature');

  let player = null;
  let ytReady = false;
  let editStarted = false;
  let startPerf = 0;
  let raf = 0;
  let currentWord = -1;

  // Fixed particles = no runtime particle engine / no WebGL.
  const starSpecs = [
    [8,17,8,-8,-24,.02,.62],[17,70,11,10,-18,.15,.72],[25,31,6,-5,-16,.28,.58],
    [34,80,8,8,-22,.44,.70],[42,20,10,-8,-18,.57,.68],[50,72,7,7,-17,.68,.60],
    [58,28,11,-10,-24,.82,.78],[67,78,6,8,-15,.96,.58],[76,18,8,-8,-21,1.08,.66],
    [84,64,10,9,-23,1.19,.74],[92,34,6,-6,-16,1.30,.60],[13,45,7,7,-19,1.42,.64],
    [30,12,5,-5,-14,1.52,.56],[48,48,8,6,-20,1.60,.66],[63,10,6,-7,-17,1.68,.58],
    [73,52,5,6,-15,1.78,.55],[88,84,7,-7,-19,1.88,.64],[54,88,5,5,-16,1.98,.56]
  ];
  starField.innerHTML = starSpecs.map(([x,y,size,dx,dy,delay,dur]) =>
    `<i class="star" style="--x:${x}%;--y:${y}%;--s:${size}px;--dx:${dx}px;--dy:${dy}px;--dx2:${dx*1.8}px;--dy2:${dy*2.1}px;--delay:${delay}s;--dur:${dur}s"></i>`
  ).join('');

  const words = [
    ['WE', 109.45], ['WERE', 109.62], ['TOO', 109.76], ['CLOSE', 110.17], ['TO', 110.66], ['THE', 111.02], ['STARS', 111.70],
    ['I', 112.90], ['NEVER', 113.48], ['KNEW', 113.76], ['SOMEBODY', 114.02], ['LIKE', 114.96], ['YOU,', 116.35], ['SOMEBODY', 116.60],
    ["FALLIN'", 118.30], ['JUST', 119.12], ['AS', 119.48], ['HARD', 119.86]
  ];

  function showScreen(target){
    screens.forEach(s => s.classList.toggle('active', s === target));
  }

  function normalizedName(v){
    return v.trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  }

  function submitName(){
    const name = normalizedName(input.value);
    if(!name){
      input.focus();
      input.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:260});
      return;
    }
    if(name === 'anny'){
      showScreen(edit);
      startEdit();
    } else {
      showScreen(gender);
    }
  }

  button.addEventListener('click', submitName);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') submitName(); });

  document.querySelectorAll('[data-gender]').forEach(btn => {
    btn.addEventListener('click', () => {
      const g = btn.dataset.gender;
      rejectCreature.className = 'creature ' + (g === 'female' ? 'angry' : 'bro');
      rejectText.textContent = g === 'female' ? 'GET THE FUCK OUT!' : "YO BRO, TS AIN'T FOR YOU!";
      showScreen(reject);
    });
  });

  document.querySelectorAll('[data-back]').forEach(btn => btn.addEventListener('click', () => {
    showScreen(gate);
    input.value = '';
    setTimeout(() => input.focus(), 250);
  }));

  function hitFX(){
    flash.classList.remove('hit');
    streak.classList.remove('hit');
    void flash.offsetWidth;
    flash.classList.add('hit');
    streak.classList.add('hit');
  }

  function setStarMoment(on){
    starField.classList.toggle('active', on);
  }

  function triggerFallGuy(){
    fallGuy.classList.remove('falling');
    void fallGuy.offsetWidth;
    fallGuy.classList.add('falling');
  }

  function showWord(i){
    if(i === currentWord) return;
    currentWord = i;
    if(i < 0 || i >= words.length) return;

    setStarMoment(i >= 0 && i <= 6);
    if(words[i][0] === "FALLIN'") triggerFallGuy();

    const currentTime = words[i][1];
    const nextTime = i < words.length - 1 ? words[i + 1][1] : END - .15;
    const duration = Math.max(.42, nextTime - currentTime);
    const direction = 'motion-down';

    wordEl.classList.remove('motion-down','hide','blue-word');
    void wordEl.offsetWidth;
    wordEl.textContent = words[i][0];
    wordEl.dataset.word = words[i][0];
    wordEl.style.setProperty('--wordDur', duration + 's');
    if(['STARS','YOU,','SOMEBODY','HARD'].includes(words[i][0])) wordEl.classList.add('blue-word');
    wordEl.classList.add(direction);
    hitFX();
  }

  function relativeCurrent(){
    if(player && ytReady && typeof player.getCurrentTime === 'function'){
      const t = player.getCurrentTime();
      if(Number.isFinite(t)) return t;
    }
    return START;
  }

  function loop(){
    const t = relativeCurrent();
    let idx = -1;
    for(let i=0;i<words.length;i++) if(t >= words[i][1]) idx = i;
    if(idx >= 0) showWord(idx);
    if(t >= END){
      if(player && ytReady) player.pauseVideo();
      setTimeout(() => {
        wordEl.classList.add('hide');
        endLove.classList.add('visible');
      }, 260);
      return;
    }
    raf = requestAnimationFrame(loop);
  }

  function beginVisuals(){
    currentWord = -1;
    endLove.classList.remove('visible');
    wordEl.classList.remove('motion-down','hide','blue-word');
    wordEl.textContent = '';
    starField.classList.remove('active');
    fallGuy.classList.remove('falling');
    cancelAnimationFrame(raf);
    loop();
  }

  function startEdit(){
    if(editStarted) return;
    editStarted = true;
    loadYouTube();
  }

  function loadYouTube(){
    if(window.YT && window.YT.Player){ initPlayer(); return; }
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.async = true;
    document.head.appendChild(s);
    window.onYouTubeIframeAPIReady = initPlayer;
  }

  function initPlayer(){
    if(player) return;
    player = new YT.Player('yt', {
      width:'1', height:'1', videoId:VIDEO_ID,
      playerVars:{autoplay:0,controls:0,disablekb:1,fs:0,playsinline:1,rel:0,start:109,end:122},
      events:{
        onReady:() => {
          ytReady = true;
          player.seekTo(START,true);
          player.unMute();
          player.setVolume(100);
          player.playVideo();
        },
        onStateChange:(event) => {
          if(event.data === YT.PlayerState.PLAYING){
            const now = player.getCurrentTime();
            if(now < START - .25 || now > END + .5){
              player.seekTo(START,true);
              return;
            }
            beginVisuals();
          }
        }
      }
    });
  }

  setTimeout(() => input.focus(), 420);
})();
</script>
</body>
</html>
