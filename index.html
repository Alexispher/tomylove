<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#030711" />
  <meta name="color-scheme" content="dark" />
  <title>TO MY LOVE</title>
  <style>
    :root {
      --bg-0: #02050d;
      --bg-1: #06142b;
      --blue-0: #dff7ff;
      --blue-1: #77ddff;
      --blue-2: #2aaeff;
      --blue-3: #1266ff;
      --blue-4: #6b5cff;
      --muted: rgba(194, 226, 255, 0.24);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg-0);
      overflow: hidden;
    }

    body {
      min-height: 100svh;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      cursor: pointer;
    }

    .sky {
      position: fixed;
      inset: 0;
      isolation: isolate;
      background:
        radial-gradient(circle at 18% 50%, rgba(18, 102, 255, .20), transparent 31%),
        radial-gradient(circle at 76% 18%, rgba(42, 174, 255, .12), transparent 30%),
        radial-gradient(circle at 72% 74%, rgba(107, 92, 255, .15), transparent 26%),
        linear-gradient(135deg, #01030a 0%, #041022 43%, #020710 100%);
    }

    .sky::before,
    .sky::after {
      content: "";
      position: absolute;
      inset: -20%;
      pointer-events: none;
    }

    .sky::before {
      z-index: -3;
      background:
        repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.025) 0 1px, transparent 1px 10px),
        radial-gradient(circle at 40% 40%, rgba(44, 180, 255, .10), transparent 38%);
      opacity: .22;
      filter: blur(.2px);
      animation: drift 26s linear infinite alternate;
    }

    .sky::after {
      z-index: -2;
      background: linear-gradient(90deg, transparent, rgba(92, 191, 255, .04), transparent);
      filter: blur(36px);
      transform: rotate(-12deg);
      animation: sweep 12s ease-in-out infinite alternate;
    }

    .starfield {
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .64;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.85) 0 1px, transparent 1.25px),
        radial-gradient(circle, rgba(83,188,255,.66) 0 1px, transparent 1.3px),
        radial-gradient(circle, rgba(127,112,255,.58) 0 .8px, transparent 1.2px);
      background-size: 123px 123px, 191px 191px, 271px 271px;
      background-position: 20px 40px, 71px 18px, 4px 122px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), rgba(0,0,0,.45));
      animation: stars 32s linear infinite;
    }

    #loveCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      filter: drop-shadow(0 0 18px rgba(41, 174, 255, .35));
    }

    .glow-orb {
      position: absolute;
      left: 19%;
      top: 51%;
      width: min(48vw, 660px);
      aspect-ratio: 1;
      translate: -50% -50%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(80, 190, 255, .15), rgba(23, 88, 255, .05) 42%, transparent 72%);
      filter: blur(18px);
      animation: breathe 5.2s ease-in-out infinite;
      pointer-events: none;
    }

    .frame {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(320px, .82fr) minmax(500px, 1.18fr);
      align-items: center;
      width: 100%;
      min-height: 100svh;
      padding: clamp(28px, 4.5vw, 76px);
      gap: clamp(28px, 5vw, 94px);
    }

    .heart-space {
      min-height: 58svh;
    }

    .message {
      width: min(760px, 100%);
      align-self: center;
      transform: translateY(-1.2vh);
    }

    .title {
      margin: 0 0 clamp(34px, 5vh, 68px);
      font-size: clamp(16px, 1.35vw, 22px);
      font-weight: 700;
      letter-spacing: .34em;
      color: rgba(213, 240, 255, .68);
      text-transform: uppercase;
    }

    .lyrics {
      display: grid;
      gap: clamp(22px, 3.2vh, 42px);
      margin: 0;
    }

    .line {
      position: relative;
      margin: 0;
      max-width: 14ch;
      font-size: clamp(38px, 4.55vw, 78px);
      line-height: .98;
      letter-spacing: -.048em;
      font-weight: 790;
      color: var(--muted);
      text-wrap: balance;
      transition:
        color .65s cubic-bezier(.2,.8,.2,1),
        transform .65s cubic-bezier(.2,.8,.2,1),
        opacity .65s cubic-bezier(.2,.8,.2,1),
        text-shadow .65s cubic-bezier(.2,.8,.2,1);
      opacity: .72;
      transform: translateX(0);
    }

    .line.active {
      color: transparent;
      opacity: 1;
      transform: translateX(14px);
      background: linear-gradient(92deg, var(--blue-0) 0%, var(--blue-1) 34%, var(--blue-2) 65%, var(--blue-4) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: 0 0 28px rgba(67, 183, 255, .20);
    }

    .line.past {
      color: rgba(154, 211, 255, .43);
      opacity: .88;
    }

    .pulse {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      z-index: 5;
      width: 54px;
      height: 54px;
      translate: -50% 0;
      display: grid;
      place-items: center;
      border: 1px solid rgba(134, 220, 255, .26);
      border-radius: 50%;
      background: rgba(7, 24, 48, .42);
      box-shadow: inset 0 0 22px rgba(74, 180, 255, .08), 0 0 28px rgba(30, 146, 255, .13);
      backdrop-filter: blur(16px);
      transition: transform .25s ease, background .25s ease, border-color .25s ease, opacity .35s ease;
    }

    .pulse::before {
      content: "";
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 11px solid rgba(204, 241, 255, .92);
      margin-left: 3px;
      filter: drop-shadow(0 0 8px rgba(82, 192, 255, .5));
      transition: .25s ease;
    }

    body.playing .pulse {
      opacity: .5;
      transform: scale(.86);
    }

    body.playing .pulse::before {
      width: 12px;
      height: 14px;
      border: 0;
      margin: 0;
      background: linear-gradient(90deg, rgba(216,245,255,.94) 0 35%, transparent 35% 65%, rgba(216,245,255,.94) 65% 100%);
      filter: drop-shadow(0 0 8px rgba(82, 192, 255, .5));
    }

    #youtubeAudio {
      position: fixed;
      width: 1px;
      height: 1px;
      left: -9999px;
      top: -9999px;
      overflow: hidden;
      opacity: .001;
      pointer-events: none;
    }

    @keyframes drift {
      from { transform: translate3d(-2%, -1%, 0) rotate(-2deg); }
      to { transform: translate3d(2%, 1%, 0) rotate(2deg); }
    }

    @keyframes sweep {
      from { transform: translateX(-5%) rotate(-12deg); opacity: .55; }
      to { transform: translateX(8%) rotate(-8deg); opacity: 1; }
    }

    @keyframes stars {
      from { transform: translate3d(0,0,0); }
      to { transform: translate3d(-70px, -40px, 0); }
    }

    @keyframes breathe {
      0%, 100% { scale: .94; opacity: .58; }
      50% { scale: 1.05; opacity: .9; }
    }

    @media (max-width: 900px) {
      body { overflow-y: auto; }
      .frame {
        min-height: 100svh;
        grid-template-columns: 1fr;
        grid-template-rows: 42svh auto;
        padding: 28px 24px 94px;
        gap: 8px;
      }
      .heart-space { min-height: 38svh; }
      .glow-orb { left: 50%; top: 26%; width: min(84vw, 560px); }
      .message {
        align-self: start;
        transform: none;
        width: min(640px, 100%);
        margin: 0 auto;
      }
      .title { margin-bottom: 28px; }
      .lyrics { gap: 21px; }
      .line { max-width: 13ch; font-size: clamp(36px, 10vw, 62px); }
      .line.active { transform: translateX(8px); }
    }

    @media (max-width: 520px) {
      .frame { grid-template-rows: 38svh auto; padding-inline: 20px; }
      .title { font-size: 13px; }
      .line { font-size: clamp(34px, 11vw, 50px); }
      .pulse { width: 48px; height: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sky::before, .sky::after, .starfield, .glow-orb { animation: none; }
      .line, .pulse { transition: none; }
    }
  </style>
</head>
<body>
  <main class="sky" aria-label="TO MY LOVE">
    <div class="starfield" aria-hidden="true"></div>
    <div class="glow-orb" aria-hidden="true"></div>
    <canvas id="loveCanvas" aria-hidden="true"></canvas>

    <section class="frame">
      <div class="heart-space" aria-hidden="true"></div>
      <div class="message">
        <h1 class="title">TO MY LOVE</h1>
        <div class="lyrics" aria-label="Lyrics">
          <p class="line" data-time="108.92">WE WERE TOO CLOSE TO THE STARS</p>
          <p class="line" data-time="112.58">I NEVER KNEW SOMEBODY LIKE YOU, SOMEBODY</p>
          <p class="line" data-time="117.63">FALLIN' JUST AS HARD</p>
        </div>
      </div>
    </section>

    <div class="pulse" aria-hidden="true"></div>
    <div id="youtubeAudio" aria-hidden="true"></div>
  </main>

  <script>
    const START = 108.92;
    const END = 120.88;
    const VIDEO_ID = 'x47TgeRJtH0';
    const lyricNodes = [...document.querySelectorAll('.line')];
    const canvas = document.getElementById('loveCanvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    let player;
    let ready = false;
    let playing = false;
    let queuedPlay = false;
    let monitorId = 0;
    let width = 0;
    let height = 0;
    let particles = [];
    let t = 0;

    function resize() {
      width = innerWidth;
      height = innerHeight;
      canvas.width = Math.floor(width * DPR);
      canvas.height = Math.floor(height * DPR);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      buildHeart();
    }

    function heartPoint(a) {
      const x = 16 * Math.sin(a) ** 3;
      const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
      return { x, y: -y };
    }

    function buildHeart() {
      const compact = width < 900;
      const cx = compact ? width * .5 : width * .235;
      const cy = compact ? height * .245 : height * .51;
      const scale = compact ? Math.min(width, height) * .0185 : Math.min(width, height) * .0205;
      const count = compact ? 680 : 1040;
      particles = Array.from({ length: count }, (_, i) => {
        const a = Math.random() * Math.PI * 2;
        const edge = heartPoint(a);
        const fill = Math.sqrt(Math.random());
        const depth = (Math.random() - .5) * 2;
        const swell = 1 + depth * .11;
        return {
          bx: cx + edge.x * scale * fill * swell,
          by: cy + edge.y * scale * fill * swell,
          depth,
          size: .7 + Math.random() * 2.5,
          phase: Math.random() * Math.PI * 2,
          drift: .6 + Math.random() * 1.4,
          alpha: .3 + Math.random() * .7
        };
      });
    }

    function drawHeart() {
      ctx.clearRect(0, 0, width, height);
      const compact = width < 900;
      const cx = compact ? width * .5 : width * .235;
      const pulse = playing ? 1 + Math.sin(t * 2.9) * .014 : 1 + Math.sin(t * 1.15) * .007;
      const rot = reducedMotion ? 0 : Math.sin(t * .32) * .12;
      const c = Math.cos(rot);
      const s = Math.sin(rot);

      for (const p of particles) {
        let dx = (p.bx - cx) * pulse;
        let dy = (p.by - (compact ? height * .245 : height * .51)) * pulse;
        const perspective = 1 + p.depth * .10;
        const rx = (dx * c - p.depth * 15 * s) * perspective;
        const rz = dx * s + p.depth * 15 * c;
        const floatY = reducedMotion ? 0 : Math.sin(t * p.drift + p.phase) * 1.7;
        const x = cx + rx;
        const y = (compact ? height * .245 : height * .51) + dy + floatY;
        const brightness = Math.max(.08, .62 + rz / 44);
        const r = Math.round(54 + brightness * 112);
        const g = Math.round(138 + brightness * 84);
        const b = 255;
        const size = p.size * (1 + brightness * .28);

        ctx.beginPath();
        ctx.fillStyle = `rgba(${r},${g},${b},${p.alpha * .78})`;
        ctx.shadowBlur = 9 + brightness * 10;
        ctx.shadowColor = `rgba(47,174,255,${.24 + brightness * .26})`;
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.shadowBlur = 0;
      t += reducedMotion ? 0 : .016;
      requestAnimationFrame(drawHeart);
    }

    function updateLyrics(current) {
      let activeIndex = -1;
      lyricNodes.forEach((node, i) => {
        if (current >= Number(node.dataset.time)) activeIndex = i;
      });
      lyricNodes.forEach((node, i) => {
        node.classList.toggle('active', i === activeIndex);
        node.classList.toggle('past', i < activeIndex);
      });
    }

    function resetLyrics() {
      lyricNodes.forEach(node => node.classList.remove('active', 'past'));
    }

    function beginMonitor() {
      cancelAnimationFrame(monitorId);
      const monitor = () => {
        if (!player || !playing) return;
        const current = player.getCurrentTime ? player.getCurrentTime() : START;
        updateLyrics(current);
        if (current >= END) {
          player.pauseVideo();
          player.seekTo(START, true);
          playing = false;
          document.body.classList.remove('playing');
          resetLyrics();
          return;
        }
        monitorId = requestAnimationFrame(monitor);
      };
      monitorId = requestAnimationFrame(monitor);
    }

    function playSegment() {
      if (!ready || !player) {
        queuedPlay = true;
        return;
      }
      player.seekTo(START, true);
      player.unMute();
      player.setVolume(100);
      player.playVideo();
      playing = true;
      document.body.classList.add('playing');
      updateLyrics(START);
      beginMonitor();
    }

    function pauseSegment() {
      if (!player || !ready) return;
      player.pauseVideo();
      playing = false;
      document.body.classList.remove('playing');
      cancelAnimationFrame(monitorId);
    }

    function toggleSegment() {
      playing ? pauseSegment() : playSegment();
    }

    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player('youtubeAudio', {
        width: '1',
        height: '1',
        videoId: VIDEO_ID,
        playerVars: {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          fs: 0,
          playsinline: 1,
          rel: 0,
          start: 109,
          end: 121,
          origin: location.origin === 'null' ? undefined : location.origin
        },
        events: {
          onReady: () => {
            ready = true;
            player.setVolume(100);
            if (queuedPlay) {
              queuedPlay = false;
              playSegment();
            }
          },
          onStateChange: event => {
            if (event.data === YT.PlayerState.PLAYING) {
              playing = true;
              document.body.classList.add('playing');
              beginMonitor();
            }
            if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
              playing = false;
              document.body.classList.remove('playing');
            }
          }
        }
      });
    };

    document.addEventListener('pointerdown', toggleSegment, { passive: true });
    document.addEventListener('keydown', event => {
      if (event.code === 'Space' || event.code === 'Enter') {
        event.preventDefault();
        toggleSegment();
      }
    });

    const yt = document.createElement('script');
    yt.src = 'https://www.youtube.com/iframe_api';
    yt.async = true;
    document.head.appendChild(yt);

    addEventListener('resize', resize, { passive: true });
    resize();
    drawHeart();
  </script>
</body>
</html>
